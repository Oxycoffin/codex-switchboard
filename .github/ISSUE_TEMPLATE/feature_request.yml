name: Feature request
description: Suggest a user-facing improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the experience rather than a specific implementation.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: This does not require patching or re-signing the official Codex app.
          required: true
        - label: This does not require exposing or sharing account credentials.
          required: true
